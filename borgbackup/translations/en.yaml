---
configuration:
  repo_path:
    name: Repository path
    description: >
      Borg repository path. Can be a local path (e.g. /mnt/backup/borg)
      or a remote SSH path (e.g. user@host:/path/to/repo).
  passphrase:
    name: Passphrase
    description: >
      Encryption passphrase for the Borg repository. Leave empty only
      for unencrypted repositories (not recommended).
  ssh_private_key:
    name: SSH private key
    description: >
      Contents of the SSH private key used to connect to remote
      repositories. Leave empty for local repositories.
  keep_daily:
    name: Keep daily backups
    description: Number of daily backup archives to keep (0 = disabled).
  keep_weekly:
    name: Keep weekly backups
    description: Number of weekly backup archives to keep (0 = disabled).
  keep_monthly:
    name: Keep monthly backups
    description: Number of monthly backup archives to keep (0 = disabled).
  schedule_enabled:
    name: Enable scheduled backups
    description: >
      Run borgmatic on a cron schedule for standalone backup without
      the Home Assistant integration triggering a backup.
  schedule_cron:
    name: Cron schedule
    description: >
      Cron expression for when to run borgmatic (e.g. "0 3 * * *" for
      daily at 3 AM). Only used when schedule_enabled is true.
