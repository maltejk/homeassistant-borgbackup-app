---
name: BorgBackup
version: "2.0.0"
slug: borgbackup
description: >
  Borg backup repository manager with Home Assistant integration.
  Exposes an HTTP API for the BorgBackup HA integration to upload,
  download, list, and delete backups.
url: https://github.com/maltejk/homeassistant-borgbackup-app
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
homeassistant_api: false
hassio_api: true
hassio_role: default
host_network: false

# Publish a discovery message so the BorgBackup integration is offered for
# automatic setup in Home Assistant (handled in run.sh via the Supervisor API).
discovery:
  - borgbackup

ports:
  8774/tcp: null
ports_description:
  8774/tcp: BorgBackup HTTP API (only needed for Docker hosts outside HA; the integration reaches the add-on over the internal network)

options:
  passphrase: ""
  ssh_private_key: ""
  init_if_not_exists: true
  keep_daily: 0
  keep_weekly: 0
  keep_monthly: 0

schema:
  repo_path: str
  passphrase: password
  ssh_private_key: password?
  init_if_not_exists: bool
  keep_daily: int(0,)
  keep_weekly: int(0,)
  keep_monthly: int(0,)
