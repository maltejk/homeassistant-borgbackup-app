---
name: BorgBackup
version: "1.0.0"
slug: borgbackup
description: >
  Borg backup repository manager with Home Assistant integration.
  Exposes an HTTP API for the BorgBackup HA integration to upload,
  download, list, and delete backups. Also runs borgmatic for
  scheduled deduplicating, encrypted backups.
url: https://github.com/maltejk/homeassistant-borgbackup-app
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: services
boot: auto
init: false
homeassistant_api: false
hassio_api: true
hassio_role: default
host_network: false

# Publish a discovery message so the BorgBackup integration is offered for
# automatic setup in Home Assistant (handled in run.sh via the Supervisor API).
discovery:
  - borgbackup

ports:
  8774/tcp: 8774
ports_description:
  8774/tcp: BorgBackup HTTP API

options:
  repo_path: ""
  passphrase: ""
  ssh_private_key: ""
  keep_daily: 7
  keep_weekly: 4
  keep_monthly: 6
  schedule_enabled: false
  schedule_cron: "0 3 * * *"

schema:
  repo_path: str
  passphrase: str
  ssh_private_key: str
  keep_daily: int
  keep_weekly: int
  keep_monthly: int
  schedule_enabled: bool
  schedule_cron: str
